name: 🚀 Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code checkout ─────────────────────────────────────
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # ── 3. Install dependencies + Playwright (for prerender) ─
      - name: 📦 Install Dependencies & Playwright Chromium
        run: |
          cd frontend
          npm ci
          npx playwright install chromium --with-deps

      # ── 4. Build frontend (Vite + Static Prerender) ──────────
      - name: 🔨 Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          NODE_ENV: production

      # ── 5. Copy root SEO files into dist/ ────────────────────
      - name: 📋 Copy Root SEO & Config Files
        run: |
          cp .htaccess frontend/dist/.htaccess
          cp robots.txt frontend/dist/robots.txt
          cp sitemap.xml frontend/dist/sitemap.xml
          cp googlelGWrPfTaqKof7IORX31wzucOg6VmouHS2417UjA_Vto.html frontend/dist/googlelGWrPfTaqKof7IORX31wzucOg6VmouHS2417UjA_Vto.html

      # ── 6. Deploy dist/ → Hostinger public_html/ via FTP ─────
      - name: 📤 FTP Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
